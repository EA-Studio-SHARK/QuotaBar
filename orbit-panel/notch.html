<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<style>
:root{
  --bg:#0b0d10;
  --card:#1c1e22;
  --subtle:#1a1f27;
  --track:#243040;
  --border:#2a2e34;
  --w1:#f1f3f6;
  --w2:#9aa1ab;
  --w3:#6b7480;
  --primary:oklch(0.72 0.15 255);
  --ok:#34d399;
  --warn:#f0b429;
  --bad:#e05a5a;
  --sans:"SF Pro Text","PingFang SC","Hiragino Sans GB","Noto Sans SC",system-ui,sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.22,.68,0,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:transparent;overflow:hidden;font-family:var(--sans);color:var(--w1);-webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;cursor:default}

/* 黑色刘海本体 */
.shape{position:absolute;top:0;left:50%;transform:translateX(-50%);background:var(--bg);overflow:hidden;
  border-radius:0 0 14px 14px;transition:width .36s var(--ease),height .36s var(--ease),border-radius .36s var(--ease),background .25s,opacity .25s}
.shape.big{border-radius:0 0 18px 18px;box-shadow:0 16px 40px rgba(0,0,0,.55),0 0 0 1px var(--border)}
.shape.tucked{background:transparent;box-shadow:none}
.layer{position:absolute;left:0;right:0;top:0;opacity:0;pointer-events:none;transition:opacity .15s}
.layer.on{opacity:1;pointer-events:auto;transition:opacity .2s .06s}

/* 收起（露出两侧耳朵） */
.ears{height:var(--nh);display:flex;align-items:center;justify-content:space-between;padding:0 10px;cursor:pointer}
.ear{display:flex;align-items:center;gap:6px;height:100%}
.count{font-size:11.5px;font-weight:600;color:var(--w2);font-variant-numeric:tabular-nums}
.ring{width:16px;height:16px;border-radius:50%;display:grid;place-items:center}
.ring::after{content:"";width:11px;height:11px;border-radius:50%;background:var(--bg)}
.alert{width:8px;height:8px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 3px rgba(245,158,11,.22);transition:opacity .4s}
.alert.dim{opacity:.42}
.idle canvas{opacity:.55}

/* 展开面板 */
.pull{padding:calc(var(--nh) + 8px) 14px 14px}
.sec-hd{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;font-weight:500;color:var(--w2);
  margin-bottom:8px}
.hd-actions{display:flex;align-items:center;gap:6px}
.sec-hd .act{color:var(--w2);font-weight:500;cursor:pointer;padding:2.5px 8px;border-radius:6px;background:var(--card);
  border:1px solid var(--border);transition:background .15s,color .15s,border-color .15s;font-size:11px}
.sec-hd .act:hover{background:var(--subtle);color:var(--w1)}
.sec-hd .act.on{color:var(--primary);border-color:color-mix(in oklab,var(--primary) 45%,var(--border));
  background:color-mix(in oklab,var(--primary) 12%,var(--card))}

/* 官方品牌图标与小人容器 */
.av-wrap{position:relative;flex:none;display:inline-flex;align-items:center;justify-content:center}
.av-brand{display:grid;place-items:center;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.14);flex:none}
.av-brand img{width:100%;height:100%;object-fit:cover;display:block}
.av-held{position:absolute;right:-4px;bottom:-3px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45));z-index:2;pointer-events:none}

/* 任务列表（lm.ikale.io 卡片与进度条风格） */
.task-list{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow-y:auto}
.task-list::-webkit-scrollbar{width:0;height:0}
.task{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;background:var(--card);
  border:1px solid var(--border);cursor:pointer;transition:background .15s,border-color .15s}
.task:hover{background:var(--subtle);border-color:#38404d}
.task .info{flex:1;min-width:0}
.task .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.task .title{font-size:12.5px;font-weight:600;color:var(--w1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task .right{display:flex;align-items:center;gap:6px;flex:none}
.task .pct{font-size:11.5px;font-weight:600;font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--primary)}
.task .pct.done{color:var(--ok)}
.task .pct.need{color:var(--warn)}
.task .sub{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;color:var(--w2);margin-top:2px}
.task .sub span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task .sub .warnc{color:var(--warn);font-weight:500}
.task .sub .el{flex:none;font-size:10.5px;color:var(--w3);font-family:var(--mono);font-variant-numeric:tabular-nums}
.pbar{height:5px;border-radius:99px;background:var(--track);overflow:hidden;margin-top:6px}
.pbar i{display:block;height:100%;border-radius:99px;background:var(--primary);transition:width .35s var(--ease)}
.pbar i.done{background:var(--ok)}
.pbar i.need{background:var(--warn)}
.reply-btn{font-size:10px;font-weight:600;padding:1.5px 7px;border-radius:5px;background:var(--warn);color:#111;cursor:pointer}
.empty-task{padding:11px 12px;border-radius:10px;background:var(--card);border:1px solid var(--border);font-size:11.5px;color:var(--w3);text-align:center}

/* 模型额度区块 */
.quota-sec{margin-top:11px;padding-top:10px;border-top:1px solid var(--border)}
.quota-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.qitem{padding:7px 9px;border-radius:9px;background:var(--card);border:1px solid var(--border)}
.qitem .ql{display:flex;align-items:center;justify-content:space-between;gap:5px;font-size:11px;font-variant-numeric:tabular-nums}
.qitem .qleft{display:flex;align-items:center;gap:5.5px;min-width:0}
.qitem .qname{font-weight:500;color:var(--w1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qitem .qval{font-weight:600;font-size:11px;font-family:var(--mono);color:var(--primary);flex:none}
.qitem .qval.warn{color:var(--warn)}
.qitem .qval.bad{color:var(--bad)}
.qitem .qnote{font-size:10px;color:var(--w3);margin-top:1.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qbar{height:4px;border-radius:99px;background:var(--track);overflow:hidden;margin-top:5px}
.qbar i{display:block;height:100%;border-radius:99px;background:var(--primary);transition:width .35s var(--ease)}
.qbar i.warn{background:var(--warn)}
.qbar i.bad{background:var(--bad)}
</style></head><body>

  const held = r && r.now && (r.now.kind === "edit" || r.now.kind === "read") ? r.now.ext : null;
  let core = "";
  if (style === "clawd") core = still(r ? r.pose : "sleeping", size, moving, region);
  else if (style === "codex") core = brandSVG("codex", size);
  else if (style === "brand") core = brandSVG(tool, size);
  else core = tool.includes("claude") ? still(r ? r.pose : "sleeping", size, moving, region) : brandSVG(tool, size);
  const badge = held && size >= 26 ? `<span class="av-held">${icon(held, 13)}</span>` : "";
  return `<div class="av-wrap">${core}${badge}</div>`;
}

const lead = () => rows.find(r => r.phase === "need") || rows.find(r => r.phase === "work") || rows[0] || null;

function renderEars() {
  stopBob();
  const l = lead(), working = rows.filter(r => r.phase === "work").length;
  const need = rows.some(r => r.phase === "need");
  const isIdle = !l || l.phase === "done";
  $("shape").classList.remove("tucked");
  let right = "";
  if (need) right = `<span class="alert"></span>`;
  else {
    const p = l ? (l.pct ?? (l.steps ? Math.round(100 * (l.done || 0) / l.steps) : 0)) : 0;
    const deg = Math.round(p * 3.6);
    const grad = l && l.phase === "done"
      ? `conic-gradient(from -90deg, #34d399 0deg ${deg}deg, #243040 ${deg}deg 360deg)`
      : `conic-gradient(from -90deg, #34d399 0deg, #38bdf8 ${Math.round(deg * 0.55)}deg, #818cf8 ${deg}deg, #243040 ${deg}deg 360deg)`;
    right = `${working > 1 ? `<span class="count">${working}</span>` : ""}<div class="ring" style="background:${grad}"></div>`;
  }
  $("ears").className = "layer on";
  $("ears").innerHTML = `<div class="ears"><div class="ear${isIdle ? " idle" : ""}">${rowAvatar(l, N.h - 8, !need && !isIdle, [-2, 0, 19])}</div><div class="ear">${right}</div></div>`;
  const dot = $("ears").querySelector(".alert");
  if (dot) { let on = true; bobTimers.push(setInterval(() => { on = !on; dot.classList.toggle("dim", !on); }, 1200)); }
}
function earsSize() { return {w: N.w + 2 * 50, h: N.h}; }
function tuckedSize() { return {w: N.w, h: N.h}; }

function scheduleTuck() {
  clearTimeout(tuckTimer);
  if (!settings.autoHide) return;
  tuckTimer = setTimeout(() => {
    if (!hovering && state === "collapsed" && settings.autoHide) {
      go("tucked");
    }
  }, 5000);
}

function taskRowHTML(r) {
  const pct = Math.max(0, Math.min(100, Math.round(r.pct ?? (r.phase === "done" ? 100 : 25))));
  const el = r.elapsed == null ? "" : r.elapsed < 1 ? "刚刚" : `${r.elapsed}m`;
  const phaseCls = r.phase === "done" ? "done" : r.phase === "need" ? "need" : "work";
  const reply = r.phase === "need" ? `<span class="reply-btn" data-jump="${esc(r.id)}">去回复</span>` : "";
  return `<div class="task" data-app="${esc(r.id)}">
    ${rowAvatar(r, 30, r.phase === "work", BIG)}
    <div class="info">
      <div class="top">
        <span class="title">${esc(r.title)}</span>
        <div class="right">
          ${reply}
          <span class="pct ${phaseCls}">${pct}%</span>
        </div>
      </div>
      <div class="sub">
        <span class="${r.phase === "need" ? "warnc" : ""}">${esc(r.text)}</span>
        <span class="el">${el}</span>
      </div>
      <div class="pbar"><i class="${phaseCls}" style="width:${pct}%"></i></div>
    </div>
  </div>`;
}

function quotaItemHTML(q) {
  const pct = Math.max(0, Math.min(100, Math.round(q.pct || 0)));
  const cls = pct >= 90 ? "bad" : pct >= 75 ? "warn" : "";
  return `<div class="qitem">
    <div class="ql">
      <div class="qleft">${brandSVG(q.name, 14)}<span class="qname">${esc(q.name)}</span></div>
      <span class="qval ${cls}">${pct}%</span>
    </div>
    ${q.note ? `<div class="qnote">${esc(q.note)}</div>` : ""}
    <div class="qbar"><i class="${cls}" style="width:${pct}%"></i></div>
  </div>`;
}

function expandedHTML() {
  const activeCount = rows.filter(r => r.phase === "work" || r.phase === "need").length;
  const taskTitle = activeCount > 0 ? `正在运行 · ${activeCount}` : `最近任务 · ${rows.length}`;
  const tasks = rows.length
    ? `<div class="task-list">${rows.map(taskRowHTML).join("")}</div>`
    : `<div class="empty-task">当前没有正在运行的 AI 任务</div>`;
  const quotaBlock = quota.length
    ? `<div class="quota-sec">
        <div class="sec-hd"><span>模型额度</span><span class="act" data-refresh="1">刷新</span></div>
        <div class="quota-grid">${quota.map(quotaItemHTML).join("")}</div>
      </div>`
    : "";
  const hideLabel = settings.autoHide ? "5秒收缩" : "一直常驻";
  return `<div class="pull">
    <div class="sec-hd">
      <span>${taskTitle}</span>
      <div class="hd-actions">
        <span class="act ${!settings.autoHide ? "on" : ""}" data-toggle-autohide="1" title="点击切换 5秒自动收缩 / 一直常驻">${hideLabel}</span>
        <span class="act" data-app="">主窗口 ↗</span>
      </div>
    </div>
    ${tasks}
    ${quotaBlock}
  </div>`;
}

function measure() {
  const el = $("pull").firstElementChild;
  return el ? Math.ceil(el.getBoundingClientRect().height) : N.h;
}

function go(next) {
  clearTimeout(shrinkTimer);
  clearTimeout(tuckTimer);
  const prev = state;
  state = next;
  const shape = $("shape");

  if (next === "tucked") {
    stopBob();
    shape.classList.remove("big");
    shape.classList.add("tucked");
    $("ears").classList.remove("on");
    $("pull").classList.remove("on");
    const size = tuckedSize();
    shape.style.width = N.w + "px";
    shape.style.height = N.h + "px";
    shrinkTimer = setTimeout(() => {
      post({type: "size", w: size.w, h: size.h, state: "tucked"});
      $("ears").innerHTML = "";
      $("pull").innerHTML = "";
    }, 380);
    return;
  }

  shape.classList.remove("tucked");
  if (next === "collapsed") {
    renderEars();
    $("pull").classList.remove("on");
    scheduleTuck();
  } else {
    stopBob();
    $("pull").innerHTML = expandedHTML();
    $("pull").classList.add("on");
    $("ears").classList.remove("on");
  }
  const size = next === "collapsed" ? earsSize() : {w: 368, h: measure()};
  shape.classList.toggle("big", next === "expanded");
  const cur = {w: shape.offsetWidth, h: shape.offsetHeight};
  const pad = next === "collapsed" && prev !== "expanded" ? 0 : 28;
  post({type: "size", w: Math.max(size.w, cur.w) + 2 * pad, h: Math.max(size.h, cur.h) + pad, state: next});
  const rest = next === "collapsed" ? 0 : 28;
  shape.style.width = size.w + "px";
  shape.style.height = size.h + "px";
  shrinkTimer = setTimeout(() => {
    post({type: "size", w: size.w + 2 * rest, h: size.h + rest, state: next});
    if (next === "collapsed") $("pull").innerHTML = "";
  }, 420);
}

window.notch = {
  setup(n) {
    N = n;
    document.documentElement.style.setProperty("--nh", n.h + "px");
    const s = earsSize();
    $("shape").style.width = s.w + "px"; $("shape").style.height = s.h + "px";
    post({type: "size", w: s.w, h: s.h, state: "collapsed"});
    go("collapsed");
  },
  update(p) {
    const newRows = p.rows || [];
    if (p.quota) quota = p.quota;
    const prevAutoHide = settings.autoHide;
    if (p.settings) settings = {...settings, ...p.settings};

    let shouldWake = false;
    if (initialized) {
      for (const r of newRows) {
        const oldPhase = prevPhases[r.id];
        if (!oldPhase && (r.phase === "work" || r.phase === "need")) shouldWake = true;
        else if (oldPhase && oldPhase !== r.phase && (r.phase === "done" || r.phase === "need")) shouldWake = true;
      }
    }
    prevPhases = {};
    for (const r of newRows) prevPhases[r.id] = r.phase;
    initialized = true;
    rows = newRows;

    if (prevAutoHide !== settings.autoHide) {
      if (!settings.autoHide && state === "tucked") { go("collapsed"); return; }
      if (settings.autoHide && state === "collapsed") { scheduleTuck(); }
    }

    if (state === "expanded") {
      stopBob();
      $("pull").innerHTML = expandedHTML();
      const h = measure();
      $("shape").style.height = h + "px";
      post({type: "size", w: 368 + 56, h: h + 28, state: "expanded"});
    } else if (state === "tucked") {
      if (shouldWake) go("collapsed");
    } else if (state === "collapsed") {
      renderEars();
      if (shouldWake) scheduleTuck();
    }
  },
  shot() {},
  collapse() { if (state === "expanded") go("collapsed"); },
};

function hover(on) {
  if (on === hovering) return;
  hovering = on;
  clearTimeout(leaveTimer);
  clearTimeout(hoverTimer);
  if (on && state !== "expanded") {
    hoverTimer = setTimeout(() => {
      if (hovering && state !== "expanded") go("expanded");
    }, 550);
  }
  if (!on && state === "expanded") {
    leaveTimer = setTimeout(() => { if (!hovering) go("collapsed"); }, 480);
  }
}
window.notch.hover = hover;
const shape = $("shape");
shape.addEventListener("mouseenter", () => hover(true));
shape.addEventListener("mouseleave", () => hover(false));
shape.addEventListener("click", e => {
  const toggleAh = e.target.closest("[data-toggle-autohide]");
  if (toggleAh) {
    settings.autoHide = !settings.autoHide;
    post({type: "setting", key: "autoHide", value: settings.autoHide});
    if (state === "expanded") $("pull").innerHTML = expandedHTML();
    return;
  }
  const ref = e.target.closest("[data-refresh]");
  if (ref) { post({type: "refresh"}); return; }
  const j = e.target.closest("[data-jump]");
  if (j) { post({type: "jump", id: j.dataset.jump}); return; }
  const a = e.target.closest("[data-app]");
  if (a) { post({type: "app", id: a.dataset.app || (lead() && lead().id)}); return; }
  if (state !== "expanded") go("expanded");
});
</script></body></html>
